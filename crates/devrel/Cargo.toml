[package]
name = "devrel-catalog"
description = "Reads a subject Prism project's facet records and writes the DevRel catalog: the LexLean Subject, Resource and Covers data, and the learning pages."
# Build-time only: pages.yml and `just catalog-check` run it; nothing shipped
# depends on it.
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
serde_json = "1.0.151"
sha2 = "0.11.1"

[lints]
workspace = true
