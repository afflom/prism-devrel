# Keeps every generated file current on main and DevRel pinned to the newest
# green UORust. On each push to main, each hour (UORust's pushes start nothing
# here) and on demand, it re-pins devrel/subject.json to the subject's newest
# commit whose gate passed, runs `just generate` through the locked SDK, and,
# when anything changed, pushes one commit and dispatches the gate and the
# page for it.
name: generate

on:
  push:
    branches: [main]
  schedule:
    - cron: '41 * * * *'
  workflow_dispatch:

permissions:
  contents: read

# Only the newest main matters: an older run's output would be refused anyway.
concurrency:
  group: generate
  cancel-in-progress: true

jobs:
  generate:
    name: re-pin the subject, run every writer and push what changed
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write
      actions: write
    steps:
      - name: Check out the exact event revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Re-pin the subject to its newest green main
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/repin.sh
      - name: Run every writer through the locked SDK
        shell: bash
        run: scripts/ci/sdk.sh 'just generate'
      - name: Push the regenerated files and dispatch the gate and the page
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          subject=$(node -e 'process.stdout.write(JSON.parse(require("fs").readFileSync("devrel/subject.json", "utf8")).commit.slice(0, 7))')
          if git diff --quiet -- devrel/subject.json; then
            message="Regenerate the generated files"
          else
            message="Pin the subject to UORust $subject and regenerate the catalog"
          fi
          scripts/ci/push.sh "$message" \
            "CONFORMANCE.md devrel/subject.json app/src/Catalog.lex.tex builder/assets.mjs" \
            bootstrap.yml pages.yml
