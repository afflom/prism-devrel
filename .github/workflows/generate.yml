# Keeps every generated file current on main and every case study pinned to
# its subject's newest green main. On each push to main, each hour (a subject's
# pushes start nothing here) and on demand, it moves each pin in
# devrel/subjects.json forward to the subject's newest main commit whose gate
# workflow passed (scripts/repin.sh, DR-53; a subject GitHub cannot answer for
# keeps its pin), runs `just generate` through the locked SDK, and,
# when anything changed, pushes one commit and dispatches the gate and the
# page for it. It also re-pins the brand to uor.foundation's newest main
# (brand/foundation.lock), so the brand, design and context-of-use facets
# regenerate from it; a site change that breaks a WCAG contrast fails the
# writer and is not pinned.
name: generate

on:
  push:
    branches: [main]
  schedule:
    - cron: '41 * * * *'
  workflow_dispatch:

permissions:
  contents: read

# Only the newest main matters: an older run's output would be refused anyway.
concurrency:
  group: generate
  cancel-in-progress: true

jobs:
  generate:
    name: re-pin every subject, run every writer and push what changed
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write
      actions: write
    steps:
      - name: Check out the exact event revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Re-pin every subject to its newest green main
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/repin.sh
      - name: Follow uor.foundation, the brand authority
        shell: bash
        run: |
          python3 -I scripts/experience/authority.py . --follow
          # Keep the new pin only when its brand still meets WCAG 2.2.
          if ! python3 -I scripts/experience/experience.py "$(mktemp -d)" .; then
            git checkout -- brand
            echo "::warning::uor.foundation's newest main breaks a WCAG 2.2 contrast; the brand stays pinned"
          fi
      - name: Run every writer through the locked SDK
        shell: bash
        run: scripts/ci/sdk.sh 'just generate'
      - name: Push the regenerated files and dispatch the gate and the page
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The commit says which subjects moved: "Pin UORust to abc1234,
          # Rule 30 to def5678 and regenerate the catalogs".
          moved=$(git show HEAD:devrel/subjects.json | node -e '
            const fs = require("fs");
            const before = Object.fromEntries(JSON.parse(fs.readFileSync(0, "utf8")).subjects.map((s) => [s.slug, s.commit]));
            const pins = JSON.parse(fs.readFileSync("devrel/subjects.json", "utf8")).subjects
              .filter((s) => !s.self && s.commit !== before[s.slug])
              .map((s) => `${s.name} to ${s.commit.slice(0, 7)}`);
            process.stdout.write(pins.length > 1 ? `${pins.slice(0, -1).join(", ")} and ${pins.at(-1)}` : pins.join(""));
          ')
          if [[ -z $moved ]]; then
            message="Regenerate the generated files"
          else
            message="Pin $moved and regenerate the catalogs"
          fi
          scripts/ci/push.sh "$message" \
            "CONFORMANCE.md devrel/subjects.json app brand builder/assets.mjs fidelity.toml" \
            bootstrap.yml pages.yml
