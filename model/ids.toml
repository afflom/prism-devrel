[[id]]
id = "FI-01"
level = "build"
suite = "fidelity"
statement = "Every record of a Prism project is scored as derived (W3C PROV-O wasDerivedFrom a source span whose κ recomputes and which holds its text), meant (a theorem names it, ISO/IEC/IEEE 29148) and, for a measure, measured (an ISO/IEC/IEEE 15939 measurement result whose κ recomputes); a source entity or result whose κ does not recompute is refused, and a span that does not hold the record's text verbatim leaves it underived"

[[id]]
id = "FI-02"
level = "build"
suite = "fidelity"
statement = "The fidelity register only shrinks: every question is keyed by its κ, a κ once closed that a later projection finds open is refused, and the committed register is byte for byte the one the model scores to"

[[id]]
id = "FI-03"
level = "build"
suite = "fidelity"
statement = "Prism-DevRel's own fidelity is measured in its model: one ISO/IEC/IEEE 15939 indicator per property, each with a result read from the committed register by its κ and decision criteria of no open question, and the Lean kernel checks every indicator is known and measured"

[[id]]
id = "FI-04"
level = "build"
suite = "fidelity"
statement = "A record no writer derives is cited from the smallest span of a primary source listed in model/provenance.toml that holds every text field of it verbatim, as a W3C PROV-O derivation by prism-fidelity; a record no listed source states stays open, and the committed citations are the ones the sources give"

[[id]]
id = "FI-05"
level = "build"
suite = "fidelity"
statement = "Every quality measure model/measures.toml lists is measured by the Lean kernel: its ISO/IEC/IEEE 15939 indicator's result is the value of a LexLean method, the decision criteria's bound is the measure's own threshold, the result carries the κ of the method's file, and a theorem that the value satisfies the criteria is checked"

[[id]]
id = "FI-06"
level = "build"
suite = "fidelity"
statement = "A record no listed source states is derived, as a W3C PROV-O derivation between records, from the records it references or that quote its text; it is closed on the derived axis only when every record it is derived from is, and a record derivation that neither references nor quotes is refused"

[[id]]
id = "FI-07"
level = "build"
suite = "fidelity"
statement = "Each source an [[author]] of model/provenance.toml wrote is attributed to that W3C PROV-O agent, and the charter that states Prism-DevRel's purpose is attributed to a person"
